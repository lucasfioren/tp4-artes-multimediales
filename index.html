<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jardín Efímero - Proyección Interactiva</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black text-slate-100 min-h-screen relative overflow-hidden">

    <!-- Canvas Principal de Proyección -->
    <canvas id="artCanvas"></canvas>

    <!-- UI Component: Indicador Flotante de Estado -->
    <div id="statusBadge" class="fixed top-6 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-all duration-700 opacity-90">
        <div class="glass-panel px-6 py-2.5 rounded-full flex items-center gap-3 border border-emerald-500/30 text-xs sm:text-sm tracking-wide">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="statusText" class="font-light tracking-wider uppercase text-emerald-200">Etapa 1: Jardín Próspero</span>
            <span id="presencePercent" class="text-xs text-slate-400 font-mono pl-2 border-l border-white/10">0%</span>
        </div>
    </div>

    <!-- UI Component: Timers Acumulativos -->
    <div id="timerBadge" class="fixed top-6 right-6 z-20 pointer-events-none transition-all duration-500">
        <div class="glass-panel px-4 py-2 rounded-2xl border border-white/10 text-xs flex flex-col gap-1 w-44">
            <div class="flex justify-between items-center text-emerald-400">
                <span class="text-[10px] uppercase font-bold tracking-wider">Paz (Soledad)</span>
                <span id="aloneTimerText" class="font-mono">0s</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-1 overflow-hidden">
                <div id="aloneTimerBar" class="bg-emerald-400 h-full w-0 transition-all duration-300"></div>
            </div>
            
            <div class="flex justify-between items-center text-rose-400 mt-1">
                <span class="text-[10px] uppercase font-bold tracking-wider">Presión (Gente)</span>
                <span id="crowdTimerText" class="font-mono">0s</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-1 overflow-hidden">
                <div id="crowdTimerBar" class="bg-rose-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- UI Component: Botón Abrir Ajustes -->
    <button id="toggleControlsBtn" class="fixed bottom-6 right-6 z-30 p-3.5 rounded-full glass-panel hover:bg-white/10 transition-all duration-300 group border border-white/10 active:scale-95" title="Ajustes de Proyección">
        <i data-lucide="settings" class="w-5 h-5 text-slate-300 group-hover:rotate-45 transition-transform duration-500"></i>
    </button>

    <!-- UI Component: Panel de Control Principal -->
    <div id="controlPanel" class="fixed bottom-20 right-6 z-30 w-80 sm:w-96 glass-panel rounded-2xl p-5 border border-white/15 shadow-2xl transition-all duration-500 transform translate-y-6 opacity-0 pointer-events-none">
        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
            <div class="flex items-center gap-2">
                <i data-lucide="sliders" class="w-4 h-4 text-emerald-400"></i>
                <h3 class="text-sm font-semibold tracking-wide text-slate-200">Controles de Proyección</h3>
            </div>
            <button id="closeControlsBtn" class="text-slate-400 hover:text-white transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="space-y-4 text-xs">
            <div class="grid grid-cols-2 gap-2">
                <button id="fullscreenBtn" class="flex items-center justify-center gap-2 py-2 px-3 bg-emerald-950/50 hover:bg-emerald-900/60 border border-emerald-500/30 rounded-xl transition-all hover:border-emerald-400 text-emerald-200">
                    <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
                    <span>Pantalla Completa</span>
                </button>
                <button id="regenBtn" class="flex items-center justify-center gap-2 py-2 px-3 bg-slate-800/50 hover:bg-slate-700/60 border border-slate-600/30 rounded-xl transition-all text-slate-300">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span>Regenerar Jardín</span>
                </button>
            </div>

            <div>
                <label class="text-slate-400 mb-1.5 block font-medium">Modo de Detección</label>
                <div class="grid grid-cols-3 gap-1.5 p-1 bg-black/40 rounded-xl border border-white/5">
                    <button id="modeAuto" class="py-1.5 px-2 rounded-lg text-center transition-all bg-emerald-600 text-white font-medium">Cámara</button>
                    <button id="modeForceAlone" class="py-1.5 px-2 rounded-lg text-center text-slate-400 hover:text-white transition-all">Solo</button>
                    <button id="modeForcePeople" class="py-1.5 px-2 rounded-lg text-center text-slate-400 hover:text-white transition-all">Presencia</button>
                </div>
            </div>

            <div class="pt-2 border-t border-white/10">
                <label class="text-slate-400 mb-1.5 block font-medium">Forzar Eventos Extremos</label>
                <div class="grid grid-cols-2 gap-1.5">
                    <button id="triggerWild" class="py-1.5 px-2 bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-500/30 text-emerald-300 rounded-lg text-center text-[11px] font-medium transition-all">🌿 Superfloración</button>
                    <button id="triggerScorch" class="py-1.5 px-2 bg-rose-900/40 hover:bg-rose-800/60 border border-rose-500/30 text-rose-300 rounded-lg text-center text-[11px] font-medium transition-all">🔥 Tierra Quemada</button>
                </div>
            </div>

            <div>
                <div class="flex justify-between text-slate-300 mb-1">
                    <span>Sensibilidad Detección</span>
                    <span id="sensitivityVal" class="font-mono text-emerald-400">50%</span>
                </div>
                <input type="range" id="sensitivitySlider" min="10" max="90" value="50" class="w-full accent-emerald-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between text-slate-300 mb-1">
                    <span>Velocidad de Reacción</span>
                    <span id="speedVal" class="font-mono text-emerald-400">Normal</span>
                </div>
                <input type="range" id="speedSlider" min="1" max="5" value="2" class="w-full accent-emerald-500 bg-slate-800 rounded-lg h-1.5 cursor-pointer">
            </div>

            <p class="text-[10px] text-slate-500 text-center italic">Presiona la tecla <b class="text-slate-300">'H'</b> para ocultar/mostrar la interfaz.</p>

            <div class="pt-2 border-t border-white/10">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-slate-400 flex items-center gap-1.5">
                        <i data-lucide="camera" class="w-3.5 h-3.5 text-slate-400"></i> Previsualización Sensor
                    </span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="togglePip" checked class="sr-only peer">
                        <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-emerald-600"></div>
                    </label>
                </div>
                
                <div id="pipContainer" class="relative w-full h-28 bg-black/60 rounded-xl overflow-hidden border border-white/10 flex items-center justify-center">
                    <video id="webcamVideo" class="absolute w-full h-full object-cover transform -scale-x-100 opacity-60" playsinline muted></video>
                    <canvas id="motionCanvas" class="absolute w-full h-full object-cover transform -scale-x-100 opacity-80 mix-blend-screen"></canvas>
                    <div id="camWarning" class="hidden absolute inset-0 bg-black/80 p-3 flex-col items-center justify-center text-center gap-1 text-amber-400/90">
                        <i data-lucide="camera-off" class="w-5 h-5 mb-1"></i>
                        <span class="text-[10px]">Cámara no accesible. Simulación con mouse activa.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas Oculto para Procesamiento Fotograma a Fotograma -->
    <canvas id="procCanvas" class="hidden"></canvas>

    <!-- Lógica JavaScript Principal -->
    <script src="script.js"></script>
</body>
</html>
